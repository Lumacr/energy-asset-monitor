version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: energy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Notice that we use 'db' (the service name) instead of 'localhost'
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/energy_db
    depends_on:
      - db

volumes:
  postgres_data: